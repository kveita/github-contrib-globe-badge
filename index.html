<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub contribution analytics</title>
  <style>
    :root { color-scheme: light; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #18202a; }
    main { width: min(94vw, 760px); padding: 28px 0 42px; text-align: center; }
    .eyebrow { letter-spacing: .28em; color: #1745d1; font-size: clamp(15px, 2.5vw, 24px); margin: 0 0 8px; }
    h1 { font-size: clamp(18px, 3vw, 28px); font-weight: 500; margin: 0 0 8px; }
    .subtle { color: #6b7280; font-size: 12px; margin: 0 0 10px; }
    .globe-wrap { position: relative; width: min(92vw, 620px); aspect-ratio: 1; margin: 0 auto; touch-action: none; }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .label { position: absolute; position-anchor: var(--label-anchor); bottom: anchor(top); left: anchor(center); translate: -50% 0; margin-bottom: 13px; padding: 9px 12px; border: 0; border-radius: 8px; background: rgba(23,23,23,.94); color: #fff; font: inherit; white-space: nowrap; pointer-events: auto; cursor: pointer; box-shadow: 0 6px 18px #0002; opacity: var(--label-visible, 0); transition: opacity .12s; z-index: 3; }
    .label::after { content: ''; position: absolute; width: 7px; height: 7px; background: #171717; transform: rotate(45deg); bottom: -3px; left: calc(50% - 3px); }
    .label strong { font-size: 19px; }
    .label span { color: #34d399; font-size: 12px; margin-left: 8px; }
    .repo-list { display: none; position: absolute; top: calc(100% + 10px); left: 50%; translate: -50% 0; min-width: 220px; padding: 8px; border-radius: 8px; background: #171717; box-shadow: 0 8px 24px #0004; text-align: left; white-space: normal; }
    .label.open .repo-list { display: grid; gap: 5px; }
    .repo-list a { display: block; color: #d1fae5; font-size: 12px; text-decoration: none; padding: 5px 7px; border-radius: 4px; }
    .repo-list a:hover, .repo-list a:focus { background: #2d3748; color: #fff; }
    .legend { margin: 4px auto 0; color: #6b7280; font-size: 12px; }
    .rule { width: min(74vw, 540px); height: 5px; margin: 24px auto 15px; background: #1745d1; }
    footer { color: #9ca3af; font-size: 11px; }
    a { color: #1745d1; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GitHub contribution globe</p>
    <h1 id="title">GitHub contribution globe</h1>
    <p class="subtle" id="summary">Loading contribution data…</p>
    <div class="globe-wrap" id="globe-wrap">
      <canvas id="globe" width="1200" height="1200" aria-label="Interactive contribution globe"></canvas>
    </div>
    <p class="legend">Drag to rotate · Green markers show repository-owner locations</p>
    <div class="rule"></div>
    <footer><a href="https://github.com/kveita/github-contrib-globe-badge">Source repository</a></footer>
  </main>
  <script type="module">
    import createGlobe from 'https://cdn.jsdelivr.net/npm/cobe@2.0.1/+esm';
    const canvas = document.querySelector('#globe');
    const data = await fetch('./data.json', { cache: 'no-store' }).then((response) => {
      if (!response.ok) throw new Error(`Unable to load data.json (${response.status})`);
      return response.json();
    });
    const state = { phi: 0, theta: 0.18, scale: 1.05 };
    const labels = [];
    let pointer = null;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    document.querySelector('#title').innerHTML = `<a href="https://github.com/${data.user}" target="_blank" rel="noopener noreferrer">${data.user}</a>`;
    document.querySelector('#summary').textContent = `${data.totalCommits.toLocaleString()} tracked commits · updated ${new Date(data.generatedAt).toLocaleDateString()}`;
    data.markers.forEach((marker, index) => {
      const element = document.createElement('div');
      element.className = 'label';
      element.setAttribute('role', 'button');
      element.tabIndex = 0;
      const percentage = Math.round(marker.commits / data.totalCommits * 100);
      const repositories = (marker.repositories || []).map((repo) => (
        `<a href="${repo.url}" target="_blank" rel="noopener noreferrer">${repo.name}</a>`
      )).join('') || '<span>No repository links available</span>';
      element.innerHTML = `<strong>${marker.commits}</strong><span>↑ ${percentage}%</span><span class="repo-list" role="menu">${repositories}</span>`;
      element.title = `${marker.owner}: ${marker.commits} commits (${percentage}%)`;
      element.style.setProperty('--label-anchor', `--cobe-marker-${index}`);
      element.style.setProperty('--label-visible', `var(--cobe-visible-marker-${index}, 0)`);
      element.addEventListener('click', (event) => {
        if (event.target.closest('a')) return;
        event.stopPropagation();
        document.querySelectorAll('.label.open').forEach((label) => { if (label !== element) label.classList.remove('open'); });
        element.classList.toggle('open');
      });
      element.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); element.click(); }
      });
      labels.push({ element });
    });
    const globe = createGlobe(canvas, {
      devicePixelRatio: 2, width: 1200, height: 1200, phi: state.phi, theta: state.theta,
      dark: 0, diffuse: 1.2, mapSamples: 16000, mapBrightness: 6, mapBaseBrightness: 0,
      baseColor: [1, 1, 1], markerColor: [0.2, 0.82, 0.45], glowColor: [1, 1, 1],
      markers: data.markers.map((marker, index) => ({ id: `marker-${index}`, location: marker.location, size: 0.055 })),
    });
    // Cobe creates a positioned anchor layer around the canvas. Labels must be
    // descendants of that layer so they inherit its generated anchor variables.
    const anchorLayer = canvas.parentElement;
    labels.forEach(({ element }) => anchorLayer.append(element));
    document.addEventListener('click', () => document.querySelectorAll('.label.open').forEach((label) => label.classList.remove('open')));
    function animate() {
      if (!pointer) state.phi += 0.0018;
      globe.update({ phi: state.phi, theta: state.theta, scale: state.scale });
      requestAnimationFrame(animate);
    }
    animate();
    canvas.addEventListener('pointerdown', (event) => { pointer = { x: event.clientX, y: event.clientY }; canvas.setPointerCapture(event.pointerId); });
    canvas.addEventListener('pointermove', (event) => {
      if (!pointer) return;
      state.phi += (event.clientX - pointer.x) / 300;
      state.theta = clamp(state.theta + (event.clientY - pointer.y) / 1000, -0.8, 0.8);
      pointer = { x: event.clientX, y: event.clientY };
    });
    const releasePointer = () => { pointer = null; };
    canvas.addEventListener('pointerup', releasePointer);
    canvas.addEventListener('pointercancel', releasePointer);
    canvas.addEventListener('wheel', (event) => { event.preventDefault(); state.scale = clamp(state.scale - event.deltaY * 0.001, 0.75, 1.35); }, { passive: false });
  </script>
</body>
</html>
