<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub contribution analytics</title>
  <style>
    :root { color-scheme: light; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #18202a; }
    main { width: min(94vw, 760px); padding: 28px 0 42px; text-align: center; }
    .eyebrow { letter-spacing: .28em; color: #1745d1; font-size: clamp(15px, 2.5vw, 24px); margin: 0 0 8px; }
    h1 { font-size: clamp(18px, 3vw, 28px); font-weight: 500; margin: 0 0 8px; }
    .subtle { color: #6b7280; font-size: 12px; margin: 0 0 10px; }
    .globe-wrap { position: relative; width: min(92vw, 620px); aspect-ratio: 1; margin: 0 auto; touch-action: none; }
    canvas { width: 100%; height: 100%; display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .label { position: absolute; position-anchor: var(--label-anchor); bottom: anchor(top); left: anchor(center); translate: -50% 0; margin-bottom: 9px; padding: 6px 8px; border: 0; border-radius: 6px; background: rgba(23,23,23,.94); color: #fff; font: inherit; white-space: nowrap; pointer-events: auto; cursor: pointer; box-shadow: 0 4px 12px #0002; opacity: var(--label-visible, 0); transition: opacity .12s; z-index: 3; }
    .label::after { content: ''; position: absolute; width: 5px; height: 5px; background: #171717; transform: rotate(45deg); bottom: -2px; left: calc(50% - 2px); }
    .label strong { font-size: 13px; }
    .label span { color: #34d399; font-size: 8px; margin-left: 5px; }
    .label .flag { color: inherit; font-size: 15px; margin: 0 5px 0 0; vertical-align: middle; }
    .repo-list { display: none; position: absolute; top: calc(100% + 10px); left: 50%; translate: -50% 0; width: min(320px, 80vw); max-height: min(300px, 50vh); overflow-y: auto; padding: 8px; border-radius: 8px; background: #171717; box-shadow: 0 8px 24px #0004; text-align: left; white-space: normal; }
    .label.open .repo-list { display: grid; gap: 5px; }
    .repo-list a { display: block; color: #d1fae5; font-size: 12px; text-decoration: none; padding: 5px 7px; border-radius: 4px; overflow-wrap: anywhere; }
    .repo-list a:hover, .repo-list a:focus { background: #2d3748; color: #fff; }
    .legend { margin: 4px auto 0; color: #6b7280; font-size: 12px; }
    .rule { width: min(74vw, 540px); height: 5px; margin: 24px auto 15px; background: #1745d1; }
    footer { color: #9ca3af; font-size: 11px; }
    a { color: #1745d1; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">GitHub contribution globe</p>
    <h1 id="title">GitHub contribution globe</h1>
    <p class="subtle" id="summary">Loading contribution data…</p>
    <div class="globe-wrap" id="globe-wrap">
      <canvas id="globe" width="1200" height="1200" aria-label="Interactive contribution globe"></canvas>
    </div>
    <p class="legend">Drag to rotate · Flags show repository-owner countries</p>
    <div class="rule"></div>
    <footer><a href="https://github.com/kveita/github-contrib-globe-badge">Source repository</a></footer>
  </main>
  <script type="module">
    import createGlobe from 'https://cdn.jsdelivr.net/npm/cobe@2.0.1/+esm';
    const canvas = document.querySelector('#globe');
    const state = { phi: 0, theta: 0.18, scale: 1.05 };
    const labels = [];
    let pointer = null;

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const flagEmoji = (code) => /^[A-Z]{2}$/.test(code || '')
      ? String.fromCodePoint(...[...code].map((letter) => letter.charCodeAt(0) + 127397))
      : '';

    let data = null;
    document.querySelector('#summary').textContent = 'Fetching data...';
    try {
      const resp = await fetch('./data.json', { cache: 'no-store' });
      document.querySelector('#summary').textContent = `Fetch status: ${resp.status}`;
      if (!resp.ok) throw new Error(`Unable to load data.json (${resp.status})`);
      data = await resp.json();
      document.querySelector('#summary').textContent = `Got data, markers: ${data.markers?.length ?? 0}`;
    } catch (error) {
      console.error('Error loading globe data:', error);
      document.querySelector('#summary').textContent = `Error: ${error.message}`;
    }
    if (data) {
      document.querySelector('#title').innerHTML = `<a href="https://github.com/${data.user}" target="_blank" rel="noopener noreferrer">${data.user}</a>`;
      document.querySelector('#summary').textContent = `${data.totalCommits.toLocaleString()} tracked commits · updated ${new Date(data.generatedAt).toLocaleDateString()}`;
      const aggregatedMarkers = new Map();
      data.markers.forEach((marker, index) => {
        const countryCode = marker.countryCode || '';

        // Compute aggregated stats per country
        let aggregate = aggregatedMarkers.get(countryCode);
        if (!aggregate) {
          aggregate = {
            countryCode,
            commits: 0,
            pullRequests: 0,
            owners: [],
            repositories: [],
            position: marker.location,
          };
          aggregatedMarkers.set(countryCode, aggregate);
        }
        aggregate.commits += marker.commits;
        aggregate.pullRequests += marker.pullRequests;
        for (const owner of marker.owners || [marker.owner]) {
          if (!aggregate.owners.includes(owner)) aggregate.owners.push(owner);
        }
        for (const repo of marker.repositories || []) {
          if (!aggregate.repositories.some((existing) => existing.url === repo.url)) {
            aggregate.repositories.push(repo);
          }
        }
      });

      // Clear and rebuild labels array
      labels.length = 0;
      aggregatedMarkers.forEach((aggregate) => {
        const element = document.createElement('div');
        element.className = 'label';
        element.setAttribute('role', 'button');
        element.tabIndex = 0;
        const percentage = Math.round(aggregate.commits / data.totalCommits * 100);
        const repositories = (aggregate.repositories || []).map((repo) => (
          `<a href="${repo.url}" target="_blank" rel="noopener noreferrer">${repo.url.split('/').slice(3).join('/')}</a>`
        )).join('') || '<span>No repository links available</span>';
        const flag = flagEmoji(aggregate.countryCode);
        element.innerHTML = `${flag ? `<span class="flag" aria-label="${aggregate.countryCode} flag">${flag}</span>` : ''}<strong>${aggregate.commits}</strong><span>↑ ${percentage}%</span><span class="repo-list" role="menu">${repositories}</span>`;
        element.title = `${aggregate.countryCode || 'Unknown country'}: ${(aggregate.owners || []).join(', ')} · ${aggregate.commits} commits, ${aggregate.pullRequests} PRs (${percentage}% of commits)`;
        const idx = data.markers.findIndex(m => m.countryCode === aggregate.countryCode && m.location[0] === aggregate.position[0] && m.location[1] === aggregate.position[1]);
        const safeIdx = idx >= 0 ? idx : 0;
        element.style.setProperty('--label-anchor', `--cobe-marker-${safeIdx}`);
        element.style.setProperty('--label-visible', `var(--cobe-visible-marker-${safeIdx}, 0)`);
        element.addEventListener('click', (event) => {
          if (event.target.closest('a')) return;
          event.stopPropagation();
          document.querySelectorAll('.label.open').forEach((label) => { if (label !== element) label.classList.remove('open'); });
          element.classList.toggle('open');
        });
        element.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); element.click(); }
        });
        labels.push({ element });
      });
    }

    const globe = createGlobe(canvas, {
      devicePixelRatio: 2, width: 1200, height: 1200, phi: state.phi, theta: state.theta,
      dark: 0, diffuse: 1.2, mapSamples: 16000, mapBrightness: 6, mapBaseBrightness: 0,
      baseColor: [1, 1, 1], markerColor: [0.2, 0.82, 0.45], glowColor: [1, 1, 1],
      markers: data.markers.map((marker, index) => ({ id: `marker-${index}`, location: marker.location, size: 0.0385 })),
    });
    // Cobe creates a positioned anchor layer around the canvas. Labels must be
    // descendants of that layer so they inherit its generated anchor variables.
    const anchorLayer = canvas.parentElement;
    labels.forEach(({ element }) => anchorLayer.append(element));
    document.addEventListener('click', () => document.querySelectorAll('.label.open').forEach((label) => label.classList.remove('open')));
    function animate() {
      if (!pointer) state.phi += 0.0018;
      globe.update({ phi: state.phi, theta: state.theta, scale: state.scale });
      requestAnimationFrame(animate);
    }
    animate();
    canvas.addEventListener('pointerdown', (event) => { pointer = { x: event.clientX, y: event.clientY }; canvas.setPointerCapture(event.pointerId); });
    canvas.addEventListener('pointermove', (event) => {
      if (!pointer) return;
      state.phi += (event.clientX - pointer.x) / 300;
      state.theta = clamp(state.theta + (event.clientY - pointer.y) / 1000, -0.8, 0.8);
      pointer = { x: event.clientX, y: event.clientY };
    });
    const releasePointer = () => { pointer = null; };
    canvas.addEventListener('pointerup', releasePointer);
    canvas.addEventListener('pointercancel', releasePointer);
    canvas.addEventListener('wheel', (event) => { event.preventDefault(); state.scale = clamp(state.scale - event.deltaY * 0.001, 0.75, 1.35); }, { passive: false });
  </script>
</body>
</html>
